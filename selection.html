    <head>
        <style>
            :root {
                --pcrm-stim-width: 100mm;
                --pcrm-menu-height: 10mm;

                --pcrm-interface-color-fg: grey;
                --pcrm-interface-color-bg: white;
                --pcrm-interface-color-text: black;

                --pcrm-interface-font: Arial, monospace;
            }

            body {
                background-color: var(--pcrm-interface-color-bg);
                font-family: var(--pcrm-interface-font);
                font-size: 5mm;
            }

            .presentation {
                position:   absolute;
                margin:     auto;
                left:       0;
                right:      0;
                top:        0;
                bottom:     0;
                width:      var(--pcrm-stim-width);
                height:     var(--pcrm-stim-width);
                /* border:     1mm solid var(--pcrm-interface-color-fg); */
            }

            .stim {
                width: 100%;
                height: 100%;
                /* Blur wiill be changed programmatically */
                filter: blur(40px);
            }

            .message-text {
                width: 100%;
                height: 100%;
                text-align: center;
                align-content: center;
                display: block;
                position: absolute;
                z-index: 1;
                top: 0;
            }

            .menu {
                position: absolute;
                bottom: -30mm;
                width: var(--pcrm-stim-width);
                height: var(--pcrm-menu-height);
                display: flex;
                align-items: center;
                justify-content: space-evenly;
            }
            
            button {
                font-family: inherit;
                font-size: inherit;
            }   

            .developer-controls {
                position: absolute;
                bottom: 1px;
                right:1px;
                font-size: 3mm;
            }
        </style>
        <script>
            var img_stim;
            var menus = {};
            var dev_readout;
            var message_readout;

            var query = new URLSearchParams(window.location.search);

            // Define blur levels as 20 even steps on a logarithmic scale from 50 to 1.
            var levels = [
                20, 15.886565, 12.619147, 10.023745,  7.962143,  6.324555,  5.023773,  3.990525,  3.169786, 2.517851,  2, 1, 0
            ];
            var stimuli;
            var n_trials = 15;
            var idx_stim = -1;
            var idx_level = 0;

            var time_appeared;
            var lastKey;

            var datalog  = {
                "version": "0.1.2",
                "date": (new Date()).toISOString(),
                "userAgent": navigator.userAgent,
                "displayProperties": {
                    "devicePixelRatio": window.devicePixelRatio,
                    "width": window.screen.width,
                    "height": window.screen.height,
                    "colorDepth": window.screen.colorDepth,
                    "orientation": window.screen.orientation.type,
                    "innerWidth": window.innerWidth,
                    "innerHeight": window.innerHeight
                },
                "experiment": {
                    "task": "pcsn/f26/stim/things-320-shine",
                    "levels": levels
                },
                "events": []
            };

            function stim_order(cap, start=1) {
                const order = new Array(cap);

                for (var i = 0; i < cap; i++) 
                    order[i] = ((start - 1 + i) % (cap)) + 1;

                return order;
            };

            function stim_advance() {
                if (idx_level > 12) {
                    stim_next();
                    return;
                }
                // Calculate the radius for the Gaussian blur.
                sd = levels[idx_level];
                filter = `blur(${sd}px)`;

                log('advance:' + filter);
                time_appeared = new Date();
                
                img_stim.style.filter = filter;
                idx_level++;
            };

            function stim_clear() {
                if (idx_level > 12) {
                    stim_next();
                    return;
                }
                // Calculate the radius for the Gaussian blur.
                idx_level=12;
                sd = 0;
                filter = `blur(${sd}px)`;

                log('clear:' + filter);
                time_appeared = new Date();
                
                img_stim.style.filter = filter;
                idx_level++;
            }

            async function stim_next() {
                idx_stim++;
                idx_level=0;
                if (idx_stim >= n_trials) {
                    removeEventListener("keydown", listener_keydown);
                    log("end");
                    display_toggle(img_stim);
                    display_toggle(message_readout);
                    message_readout.innerText = "End. Thank you for participating.";
                    menus['sel'].innerText = '';
                    return;
                }



                file = `/pcsn/f26/stim/things-320-shine/${String(stimuli[idx_stim])}`;
                dev_readout.innerText = stimuli[idx_stim];
                log(`image:${stimuli[idx_stim]}`)
                removeEventListener("keydown", listener_keydown);
                
                display_toggle(img_stim);
                display_toggle(message_readout);

                if (img_stim.src) {
                    const prev = img_stim.src;
                    img_stim.src = '';
                    URL.revokeObjectURL(prev);
                }


                const res_promise = fetch(file);

                setTimeout(async () => {menus['sel'].innerText = "";}, 1000);

                setTimeout(async ()=>{
                    const res = await res_promise;
                    
                    if (!res.ok) throw new Error(res.statusText);

                    const blob = await res.blob();
                    const objectURL = URL.createObjectURL(blob);

                    img_stim.src=objectURL;

                    display_toggle(img_stim);
                    display_toggle(message_readout);

                    addEventListener("keydown", listener_keydown);

                    stim_advance();

                }, 1250);
            };


            function menu_show(menu) {
                Object.entries(menus).forEach(([name, el]) => {
                    if (name == menu)
                        el.style.display = 'flex';
                    else
                        el.style.display = 'none';
                });
            };

            function display_toggle(el, set, initial) {
                if (set) {
                    el.style.display = set;
                    return;
                }

                if (el.style.display == 'none')
                    el.style.display = initial || 'unset';
                else
                    el.style.display = 'none';
            }

            function log(event) {
                const timestamp = (new Date()).toISOString();
                datalog["events"].push({"time": timestamp, "event": event});
            };

            function download() {
                const blob = new Blob([JSON.stringify(datalog)], {
                type: "application/json",
                });
               
                const node = document.createElement('a');
                node.href =  URL.createObjectURL(blob);
                node.download = `PCSNF26_Norm_${datalog.date.replaceAll(':', '').substring(0,17)}.json`;
                node.display = 'none';
                document.body.appendChild(node);
                node.click();
                URL.revokeObjectURL(node.href);
                node.remove();
                
            };

            function listener_keydown(ev) {
                

                if ((((new Date()) - time_appeared) < 500) && ev.key == lastKey) {
                    menus['sel'].innerText = "too fast";
                    menus['sel'].style.color = 'red';
                    menus['sel'].style.fontWeight = 'bold';
                    log(`fastkey:${ev.key}`);
                    time_appeared = new Date();
                    return;
                }
                
                log(`key:${ev.key}`);
                lastKey = ev.key;

                menus['sel'].style.color = 'unset';
                menus['sel'].style.fontWeight = 'unset';
                
                switch (ev.key) {
                    case 'f':
                        menus['sel'].innerText = "no guess";
                        stim_advance();
                        break;
                    case 'g':
                        menus['sel'].innerText = "low confidence guess";
                        stim_advance();
                        break;
                    case 'h':
                        menus['sel'].innerText = "high confidence guess";
                        stim_clear();
                        break;
                    case 'c':
                        menus['sel'].innerText = "abandoned guess";
                        break;
                    case 'e':
                        menus['sel'].innerText = "marked for review";
                        stim_next();
                        break;
                    default:
                        console.log(`Invalid key: '${ev.key}'.`)
                }
            }

            function listener_begin(ev) {
                if (ev.key != 'f')
                    return;

                log('begin');
                removeEventListener('keydown', listener_begin);
                message_readout.innerText = '';
                display_toggle(message_readout);
                stim_next();
            };

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }


            addEventListener("DOMContentLoaded", function (ev) {

                stimuli = ["airboat.jpg","apple_tree.jpg","aquarium.jpg","artichoke.jpg","backgammon.jpg","badge.jpg","baklava.jpg","banana_peel.jpg","bank.jpg","basil.jpg","bathrobe.jpg","baton4.jpg","battery.jpg","bedpan.jpg","belt_buckle.jpg","belt.jpg","binoculars.jpg","birdbath.jpg","blinder.jpg","blower.jpg","board.jpg","bonnet.jpg","bookshelf.jpg","bow1.jpg","bow3.jpg","bowling_ball.jpg","brace.jpg","bracelet1.jpg","braid.jpg","branch.jpg","breadbox.jpg","bread.jpg","briefcase.jpg","broom.jpg","bumper.jpg","cabinet.jpg","camera2.jpg","cane.jpg","canister.jpg","canoe.jpg","canvas.jpg","carrot.jpg","cart.jpg","cashew.jpg","cash_register.jpg","cauliflower.jpg","cd_player.jpg","centerpiece.jpg","chalice.jpg","chalk.jpg","cheese.jpg","chicken_wire.jpg","chime.jpg","chimney.jpg","chip.jpg","chopsticks.jpg","chute.jpg","clam.jpg","clarinet.jpg","clay.jpg","cleat.jpg","clothesline.jpg","clothespin.jpg","coaster.jpg","cocktail.jpg","cocoon.jpg","coffee_filter.jpg","combination_lock.jpg","comb.jpg","comic_book.jpg","compass.jpg","copier.jpg","coverall.jpg","crate.jpg","crumb.jpg","cufflink.jpg","dashboard.jpg","defibrillator.jpg","dirt_bike.jpg","dishrag.jpg","dogfood.jpg","doily.jpg","dollhouse.jpg","doormat.jpg","doorstop.jpg","dough.jpg","dreidel.jpg","dresser.jpg","dress.jpg","drumstick.jpg","dumbbell.jpg","duster.jpg","earplug.jpg","elbow.jpg","engine.jpg","exhaust_pipe.jpg","fan.jpg","fast_food.jpg","fence.jpg","fingerprint.jpg","fire_hydrant.jpg","flagpole.jpg","flamingo.jpg","flashbulb.jpg","flipper.jpg","floss.jpg","fountain_pen.jpg","freezer.jpg","fungus.jpg","funnel.jpg","fur_coat.jpg","garbage_truck.jpg","gasket.jpg","gavel.jpg","gearshift.jpg","ginger.jpg","globe.jpg","go-kart.jpg","golf_cart.jpg","grain.jpg","granite.jpg","granola.jpg","grapevine.jpg","gravel.jpg","grill.jpg","guardrail.jpg","gum.jpg","gurney.jpg","hairdryer.jpg","hairnet.jpg","hard_disk.jpg","hatbox.jpg","hay.jpg","headlamp.jpg","highchair.jpg","honeypot.jpg","hook1.jpg","hot_tub.jpg","h er.jpg","sweatsuit.jpg","swing.jpg","taffy.jpg","taillight.jpg","tambourine.jpg","tapestry.jpg","teapot.jpg","tennis_ball.jpg","thermometer.jpg","thermos.jpg","tile.jpg","tongs.jpg","touchpad.jpg","toy.jpg","traffic_light.jpg","trapdoor.jpg","tree_trunk.jpg","triangle.jpg","tripod.jpg","trunk.jpg","tupperware.jpg","turtleneck.jpg","tuxedo.jpg","typewriter.jpg","vegetable.jpg","velcro.jpg","vending_machine.jpg","videocassette.jpg","viewfinder.jpg","waffle_iron.jpg","walnut.jpg","washboard.jpg","water_filter.jpg","water_heater.jpg","wax.jpg","wax_paper.jpg","wick.jpg","wig.jpg","window.jpg","wire.jpg","yarn.jpg","yolk.jpg"];

                shuffleArray(stimuli);

                img_stim     = document.getElementById("stim");

                menus['sel'] = document.getElementById("menu-select");
                menus['chk'] = document.getElementById("menu-check");
                menus['nam'] = document.getElementById("menu-name")

                message_readout = document.getElementById("message");
                message_readout.innerHTML= "<p>On each image, continue pressing <b>f</b> until the earliest point you feel certain about the identity of the object.</p><p>When you feel certain, press <b>h</b> until the object is clear.</p><p>Mark images for manual review with <b>e</b>.</p><p>Please do this for 30 images and then email your results file, along with any comments about the images.</p>"

                dev_readout  = document.getElementById("developer-image-idx");
                

                Object.values(menus).forEach(el => el.style.display = 'none');
                menu_show('sel');

                addEventListener('keydown', listener_begin);
            });
        </script>
    </head>
    <body>
           <div class="presentation">

            
            <!-- The stimulus image -->
            <img id="stim" class="stim">
            <div id="message" class="message-text"></div>
            
            <!-- Select the object -->
            <div id="menu-select" class="menu">
            </div>

            <!-- Determine if guess was correct (clarified) -->
            <div id="menu-check" class="menu">
                Were you correct? <button onclick="log('correct');stim_next();"></buttononclick>Yes</button>
                <button onclick="log('incorrect');stim_next();">No</button>
            </div>
            
            <!-- Name the object -->
            <div id="menu-name" class="menu">
                <button>Cancel</button>
                <input type="text" placeholder="It's a... (answer here)">
                <button>Submit</button>
            </div>
        </div>
        <div class="developer-controls">
            Image <span id="developer-image-idx"></span>
            <button onclick="download()">Download Results</button>
            <a href="mailto:mpascale@bu.edu?subject=pcsnf26_cal_v0.1.2&body=Attach the JSON data file.">Email Your Results</a>
        </div>
    </body>
